# Contrôle de chaque pull request vers main : dépendances figées, lint, tests.
# Mêmes versions et commandes que publier-article.yml. Un lint rouge fait échouer
# le job « verifier », que la protection de main exige avant tout merge.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
        env:
          NEXT_TELEMETRY_DISABLED: "1"
