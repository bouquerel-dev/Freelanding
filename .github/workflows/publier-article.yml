# Publication automatique des articles qu'Eliott valide dans le cockpit.
# Le détail, et ce qui se passe en cas d'échec : docs/BLOG.md, « Publication automatique ».
#
# Runner hébergé par GitHub : gratuit sans limite sur un dépôt public, et il ne
# fait tourner aucun code de ce dépôt public sur la machine d'Eliott. Aucun
# déclencheur de pull request : le jeton du cockpit ne sert qu'aux exécutions
# planifiées ou lancées à la main par le propriétaire.
name: Publier l'article validé

on:
  schedule:
    # Tous les jours, chaque heure de 8 h à 18 h à Paris (heure d'été ; une heure
    # plus tôt l'hiver) : un article par jour, week-end compris (2026-11-23). Le
    # script laisse les pages par métier au repos le week-end et s'arrête dès
    # qu'un article est parti dans la journée. GitHub retarde et saute ce cron
    # sous charge : le Mac le lance aussi chaque heure par workflow_dispatch
    # (docs/BLOG.md, « Ce qui se passe après la validation »).
    - cron: "17 6-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-blog
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # La protection de main exige le check « verifier » de la CI ; seule la clé
      # de déploiement « publication-blog » la contourne, pour pousser l'article.
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY_PUBLICATION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Publier
        env:
          COCKPIT_AGENT_TOKEN: ${{ secrets.COCKPIT_BLOG_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/publier-articles.ts --auto
